services:
  - type: web
    name: basketball-injury-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RESULT_DIR
        value: /opt/render/project/src/data/results
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
